name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulnscan
          POSTGRES_PASSWORD: vulnscan
          POSTGRES_DB: vulnscan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulnscan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # conftest.py creates/uses a separate "vulnscan_test" database on this
      # same server - see backend/tests/conftest.py for why.
      TEST_DATABASE_URL: postgresql://vulnscan:vulnscan@localhost:5432/vulnscan_test
      DATABASE_URL: postgresql://vulnscan:vulnscan@localhost:5432/vulnscan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        run: pytest -v

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run vitest
        working-directory: frontend
        run: npm test

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
