services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vulnscan
      POSTGRES_PASSWORD: vulnscan
      POSTGRES_DB: vulnscan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnscan"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    # Applies pending Alembic migrations before serving - without this, a
    # fresh `docker compose up` on an empty Postgres volume boots the API
    # against a database with no tables at all.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vulnscan:vulnscan@postgres:5432/vulnscan
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    # Mounts the host's Docker socket so the worker can launch scan containers
    # on the host daemon ("Docker-out-of-Docker") instead of nesting a daemon in here.
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      # Build context for the ZAP scanner image - lets the worker build it
      # itself on first use instead of requiring a manual `docker build` step.
      - ./scanner:/scanner:ro
      # Same pattern for the sqlmap scanner image (opt-in "aggressive" scans).
      - ./sqlmap-scanner:/sqlmap-scanner:ro
      # Same pattern again for the bandit/safety code-scanner image (uploaded-code scans).
      - ./code-scanner:/code-scanner:ro
    environment:
      DATABASE_URL: postgresql://vulnscan:vulnscan@postgres:5432/vulnscan
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      # Anonymous volume - shadows the bind mount's node_modules with the
      # one installed during the image build. Without this, the bind mount
      # above would replace the container's Linux node_modules (native
      # binaries like esbuild/rollup included) with whatever is - or isn't -
      # in the host's Windows frontend/node_modules, breaking the install.
      - /app/node_modules
    ports:
      - "5173:5173"

  # DVWA (Damn Vulnerable Web Application) - a deliberately vulnerable PHP app
  # used here as a controllable, self-hosted sqlmap test target, replacing
  # dependence on shared public sandboxes like testphp.vulnweb.com (which
  # started rate-limiting/blocking this network after the last aggressive
  # scan - see NOTES.md section 16). Dev/test only, never exposed publicly.
  dvwa:
    image: vulnerables/web-dvwa
    ports:
      - "4280:80"

volumes:
  postgres_data:

# Named explicitly (instead of the auto-generated "<project>_default") so
# scanner containers - launched as Docker-out-of-Docker *siblings* of the
# worker, not children of it (see NOTES.md section 11) - can be attached to
# this exact network by name and resolve compose service hostnames like
# "dvwa", the same way "worker" resolves "postgres"/"redis".
networks:
  default:
    name: vulnscan-network
